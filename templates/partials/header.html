{% load static %}
<header class="site-header">
  <div class="container site-header__inner">
    <a href="{% url 'pages:home' %}" class="logo" aria-label="Tabuk Haraj Furniture — home">
      <img class="logo__icon" src="{% static 'images/home-icon.svg' %}" alt="" width="30" height="30" aria-hidden="true">
      <span class="logo__text">
        <span class="logo__name">Tabuk Haraj</span>
        <span class="logo__sub">FURNITURE</span>
      </span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Main">
      <a href="{% url 'pages:home' %}" class="nav__link is-active">Home</a>
      <a href="{% url 'pages:home' %}#categories" class="nav__link">Categories</a>
      <a href="{% url 'pages:home' %}#listings" class="nav__link">All Listings</a>
      <a href="{% url 'pages:home' %}#about" class="nav__link">About Us</a>
      <a href="{% url 'pages:home' %}#contact" class="nav__link">Contact</a>
    </nav>

    <div class="site-header__actions">
      <a href="?lang=ar" class="header-util header-util--lang">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
          <path d="M2 12h20"/>
        </svg>
        <span lang="ar" dir="rtl">العربية</span>
        <svg class="icon icon--xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </a>

      <a href="tel:+966571937127" class="header-util header-util--phone">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>+966 57 193 7127</span>
      </a>

      <button type="button" class="header-search" id="header-search" aria-label="Open search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
      </button>

      <a href="https://maps.google.com/?q=Tabuk,+Saudi+Arabia" target="_blank" rel="noopener noreferrer" class="btn btn--gold header-cta">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Visit Showroom
      </a>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <svg class="icon icon--menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
        </svg>
        <svg class="icon icon--close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>
</header>
