{% load static site_lang %}
{% load l10n %}
{% if listings %}
<section class="section listings" id="listings" itemscope itemtype="https://schema.org/ItemList">
  <meta itemprop="name" content="Featured Used Furniture & Appliances Listings">
  <meta itemprop="description" content="Hot deals on quality used furniture, ACs, fridges, washing machines, sofas and bedroom sets in Tabuk. All items tested, warranted 30 days, with free delivery.">
  <div class="container">
    <div class="section-head">
      <div class="section-head__left">
        <p class="section-eyebrow">{% t "Featured Listings" %}</p>
        <h2 class="section-title">{% t "Hot Deals Right Now" %}</h2>
      </div>
    </div>

    <div class="listings__grid">
      {% for item in listings %}
      <article class="listing-card" itemscope itemtype="https://schema.org/Product" itemprop="itemListElement" itemref="listing-image listing-name listing-price listing-condition listing-availability listing-seller" data-position="{{ forloop.counter }}">
        <meta itemprop="position" content="{{ forloop.counter }}">
        <meta itemprop="description" content="{{ item.description|default:item.title|truncatechars:160|escape }}">
        <span itemprop="brand" itemscope itemtype="https://schema.org/Brand" hidden>
          <meta itemprop="name" content="Tabuk Haraj Furniture">
        </span>
        <span itemprop="hasMerchantReturnPolicy" itemscope itemtype="https://schema.org/MerchantReturnPolicy" hidden>
          <meta itemprop="applicableCountry" content="SA">
          <meta itemprop="returnPolicyCategory" content="https://schema.org/MerchantReturnFiniteReturnWindow">
          <meta itemprop="merchantReturnDays" content="30">
          <meta itemprop="returnMethod" content="https://schema.org/ReturnAtStoreLocation">
          <meta itemprop="returnFees" content="https://schema.org/FreeReturn">
        </span>
        <a href="{% url 'pages:product' item.slug %}" class="listing-card__link" itemprop="url">
          <div class="listing-card__media">
            <img
              src="{% if item.image %}{{ item.image.url }}{% else %}{% static 'images/placeholder.webp' %}{% endif %}"
              alt="{{ item.title }} - Quality used item at Tabuk Haraj Furniture showroom"
              width="296"
              height="160"
              loading="lazy"
              data-fallback="{% static 'images/placeholder.webp' %}"
              itemprop="image"
              id="listing-image"
            >
            <span class="listing-card__badge">{% t item.get_condition_display %}</span>
          </div>
          <div class="listing-card__body">
            <p class="listing-card__title" dir="rtl" lang="ar" itemprop="name" id="listing-name">{{ item.title|bidi_fix }}</p>
            <p class="listing-card__price" itemprop="offers" itemscope itemtype="https://schema.org/Offer" id="listing-price">
              <meta itemprop="price" content="{{ item.price|unlocalize }}">
              <meta itemprop="priceCurrency" content="SAR">
              <meta itemprop="availability" content="https://schema.org/InStock" id="listing-availability">
              <meta itemprop="itemCondition" content="https://schema.org/UsedCondition" id="listing-condition">
              <span itemprop="seller" itemscope itemtype="https://schema.org/LocalBusiness" id="listing-seller" hidden>
                <meta itemprop="name" content="Tabuk Haraj Furniture">
                <meta itemprop="url" content="https://tabukharajfurniture.com/">
              </span>
              <span itemprop="shippingDetails" itemscope itemtype="https://schema.org/OfferShippingDetails" hidden>
                <span itemprop="shippingRate" itemscope itemtype="https://schema.org/MonetaryAmount" hidden>
                  <meta itemprop="value" content="0">
                  <meta itemprop="currency" content="SAR">
                </span>
                <span itemprop="shippingDestination" itemscope itemtype="https://schema.org/DefinedRegion" hidden>
                  <meta itemprop="addressCountry" content="SA">
                </span>
                <span itemprop="deliveryTime" itemscope itemtype="https://schema.org/ShippingDeliveryTime" hidden>
                  <span itemprop="handlingTime" itemscope itemtype="https://schema.org/QuantitativeValue" hidden>
                    <meta itemprop="minValue" content="0">
                    <meta itemprop="maxValue" content="0">
                    <meta itemprop="unitCode" content="DAY">
                  </span>
                  <span itemprop="transitTime" itemscope itemtype="https://schema.org/QuantitativeValue" hidden>
                    <meta itemprop="minValue" content="0">
                    <meta itemprop="maxValue" content="1">
                    <meta itemprop="unitCode" content="DAY">
                  </span>
                </span>
              </span>
              {{ item.price_display }}
            </p>
          </div>
        </a>
      </article>
      {% endfor %}
    </div>

    <div class="listings__more">
      <a href="{% url 'pages:products' %}" class="btn btn--gold">{% t "View All Products" %}</a>
    </div>
  </div>
</section>
{% endif %}
