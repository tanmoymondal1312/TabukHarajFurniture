{% load static %}
{% if listings %}
<section class="section listings" id="listings" itemscope itemtype="https://schema.org/ItemList">
  <meta itemprop="name" content="Featured Used Furniture & Appliances Listings">
  <meta itemprop="description" content="Hot deals on quality used furniture, ACs, fridges, washing machines, sofas and bedroom sets in Tabuk. All items tested, warranted 30 days, with free delivery.">
  <div class="container">
    <div class="section-head">
      <div class="section-head__left">
        <p class="section-eyebrow">Featured Listings</p>
        <h2 class="section-title">Hot Deals Right Now</h2>
      </div>
    </div>

    <div class="listings__grid">
      {% for item in listings %}
      <article class="listing-card" itemscope itemtype="https://schema.org/Product" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" itemref="listing-image listing-name listing-price listing-condition listing-availability listing-seller" data-position="{{ forloop.counter }}">
        <meta itemprop="position" content="{{ forloop.counter }}">
        <a href="{% url 'pages:product' item.slug %}" class="listing-card__link" itemprop="url">
          <div class="listing-card__media">
            <img
              src="{% if item.image %}{{ item.image.url }}{% else %}{% static 'images/placeholder.webp' %}{% endif %}"
              alt="{{ item.title }} - Quality used item at Tabuk Haraj Furniture showroom"
              width="296"
              height="160"
              loading="lazy"
              data-fallback="{% static 'images/placeholder.webp' %}"
              itemprop="image"
              id="listing-image"
            >
            <span class="listing-card__badge">{{ item.get_condition_display }}</span>
          </div>
          <div class="listing-card__body">
            <p class="listing-card__title" dir="rtl" lang="ar" itemprop="name" id="listing-name">{{ item.title }}</p>
            <p class="listing-card__price" itemprop="offers" itemscope itemtype="https://schema.org/Offer" id="listing-price">
              <meta itemprop="priceCurrency" content="SAR">
              <meta itemprop="availability" content="https://schema.org/InStock" id="listing-availability">
              <meta itemprop="itemCondition" content="https://schema.org/UsedCondition" id="listing-condition">
              <meta itemprop="seller" itemscope itemtype="https://schema.org/LocalBusiness" id="listing-seller">
              <meta itemprop="name" content="Tabuk Haraj Furniture">
              <meta itemprop="url" content="https://tabukharajfurniture.com/">
              {{ item.price_display }}
            </p>
          </div>
        </a>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
