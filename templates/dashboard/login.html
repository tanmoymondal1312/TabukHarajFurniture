{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Tabuk Haraj Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="dash login-page">
  <main class="login-card">
    <div class="login-card__brand">
      <span class="brand__icon brand__icon--lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      </span>
      <h1>Welcome back</h1>
      <p>Sign in to manage your products and categories</p>
    </div>

    {% if form.errors %}
      <div class="alert alert--error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
        <span>Wrong username or password. Please try again.</span>
      </div>
    {% endif %}

    <form method="post" class="login-form" novalidate>
      {% csrf_token %}
      <label class="field">
        <span class="field__label">Username</span>
        <input class="input" type="text" name="username" value="{{ form.username.value|default:'' }}" autofocus required>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="input" type="password" name="password" required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn--gold btn--block">Sign in</button>
    </form>

    <a class="login-card__back" href="{% url 'pages:home' %}">&larr; Back to website</a>
  </main>
</body>
</html>
